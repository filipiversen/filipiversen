<svg xmlns="http://www.w3.org/2000/svg" id="svg-04-platform-architecture" width="1400" height="1070" viewBox="0 0 1400 1070" role="img" aria-labelledby="svg-04-platform-architecture-title svg-04-platform-architecture-desc">
<title id="svg-04-platform-architecture-title">A stack with clear responsibilities</title>
<desc id="svg-04-platform-architecture-desc">Customer, broker, and admin experiences share a Next.js and TypeScript application hosted on AWS Lightsail. Server business rules and access checks connect through TypeORM to PostgreSQL, with external payment, address validation, and policy submission services.</desc>
<defs>
 <pattern id="svg-04-platform-architecture-dots" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#767b70" opacity=".35"/></pattern>
