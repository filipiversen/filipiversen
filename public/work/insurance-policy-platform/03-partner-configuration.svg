<svg xmlns="http://www.w3.org/2000/svg" id="svg-03-partner-configuration" width="1400" height="1030" viewBox="0 0 1400 1030" role="img" aria-labelledby="svg-03-partner-configuration-title svg-03-partner-configuration-desc">
<title id="svg-03-partner-configuration-title">Shared templates, separate partners</title>
<desc id="svg-03-partner-configuration-desc">One shared quote template is assigned to two fictional partners. Each retains its own branding, links, and settings. Agent links inherit the partner configuration.</desc>
<defs>
 <pattern id="svg-03-partner-configuration-dots" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#767b70" opacity=".35"/></pattern>
 <filter id="svg-03-partner-configuration-shadow" x="-15%" y="-15%" width="140%" height="150%"><feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#20251c" flood-opacity=".10"/></filter>
</defs>
<style>#svg-03-partner-configuration text {font-synthesis:none;font-variant-numeric:tabular-nums} #svg-03-partner-configuration {isolation:isolate}</style>
