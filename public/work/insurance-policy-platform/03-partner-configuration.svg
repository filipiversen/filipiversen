vetica, sans-serif" font-size="12" font-weight="400" fill="#62645e" text-anchor="middle">Partner B / Your quote</text><circle cx="39" cy="70" r="11" fill="#20211f" stroke="none"/><path d="M32 74l14-9" fill="none" stroke="#fafaf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="59" y="75" font-family="'Courier New', monospace" font-size="13" font-weight="400" fill="#20211f" text-anchor="start" letter-spacing="1.4">PARTNER B</text><text x="25" y="127" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#20211f" text-anchor="start" letter-spacing="-0.8">Coverage for what comes next.</text><text x="25" y="157" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#62645e" text-anchor="start">A few details. A quote built around you.</text><rect x="25" y="179" width="408" height="38" rx="3" fill="#20211f" stroke="none" /><text x="229" y="204" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#fafaf7" text-anchor="middle">Start your quote →</text><text x="25" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#62645e" text-anchor="start">Own branding</text><text x="222" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#62645e" text-anchor="start">Own links &amp; settings</text></g><text x="64" y="932" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#20211f" text-anchor="start" letter-spacing="-0.5">Agent links inherit their partner’s branding, rules, and configuration.</text><path d="M64 964H1336" fill="none" stroke="#999d93" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="995" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#62645e" text-anchor="start">Illustrative partner names and interfaces.</text><text x="1336" y="995" font-family="'Courier New', monospace" font-size="12" 