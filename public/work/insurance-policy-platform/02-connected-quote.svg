<svg xmlns="http://www.w3.org/2000/svg" id="svg-02-connected-quote" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="svg-02-connected-quote-title svg-02-connected-quote-desc">
<title id="svg-02-connected-quote-title">A connected quote journey</title>
<desc id="svg-02-connected-quote-desc">Three illustrative screens show a $25,000 coverage selection at a sample $20 monthly rate, payment review, and the accepted submission linked to the same quote. These are fictional interface illustrations, not product screenshots or real rates.</desc>
<defs>
 <pattern id="svg-02-connected-quote-dots" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#767b70" opacity=".35"/></pattern>
