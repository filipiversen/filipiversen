<svg xmlns="http://www.w3.org/2000/svg" id="svg-05-submission-recovery" width="1400" height="1020" viewBox="0 0 1400 1020" role="img" aria-labelledby="svg-05-submission-recovery-title svg-05-submission-recovery-desc">
<title id="svg-05-submission-recovery-title">Recover only the unfinished step</title>
<desc id="svg-05-submission-recovery-desc">An external provider accepts policy P-1048, but local customer activation fails. The application retains the accepted result and retries customer activation, linking the active customer record to the existing policy without repeating policy submission.</desc>
<defs>
 <pattern id="svg-05-submission-recovery-dots" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#767b70" opacity=".35"/></pattern>
 <filter id="svg-05-submission-recovery-shadow" x="-15%" y="-15%" width="140%" height="150%"><feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#20251c" flood-opacity=".10"/></filter>
</defs>
<style>#svg-05-submission-recovery text {font-synthesis:none;font-variant-numeric:tabular-nums} #svg-05-submission-recovery {isolation:isolate}</style>
<rect x="0" y="0" width="1400" height="3000" rx="0" fill="#f2f1ec" stroke="none" /><text x="64" y="42" font-family="'Courier New', monospace" font-size="14" font-weight="400" fill="#62645e" text-anchor="start" letter-spacing="1.4">INSURANCE PLATFORM / FIELD NOTES</text><text x="1336" y="42" font-family="'Courier New', monospace" font-size="14" font-weight="400" fill="#62645e" text-anchor="end" letter-spacing="1.4">05</text><path d="M64 61H1336" fill="none" stroke="#999d93" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="128" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="600" fill="#20211f" text-anchor="start" letter-spacing="-2.4">Recover the record.</text><text x="64" y="185" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="600" fill="#20211f" text-anchor="start" letter-spacing="-2.4">Keep the policy.</text><text x="64" y="227" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62645e" text-anchor="start">Retry the unfinished step after an accepted submission.</text><g transform="translate(121 374) scale(1.06) rotate(-2)"><ellipse cx="211.0" cy="398" rx="188.16" ry="26" fill="url(#svg-05-submission-recovery-dots)"/><rect x="18" y="21" width="392" height="381" rx="3" fill="#e7e7df" stroke="#b6b8af" /><rect x="12" y="14" width="392" height="381" rx="3" fill="#e7e7df" stroke="#b6b8af" /><rect x="6" y="7" width="392" height="381" rx="3" fill="#e7e7df" stroke="#b6b8af" /><rect x="0" y="0" width="392" height="381" rx="3" fill="#fafaf7" stroke="#8e9188" filter="url(#svg-05-submission-recovery-shadow)"/><text x="27" y="40" font-family="'Courier New', monospace" font-size="13" font-weight="400" fill="#62645e" text-anchor="start" letter-spacing="1.4">EXTERNAL POLICY PROVIDER</text><path d="M27 57H365" fill="none" stroke="#b6b8af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(196 127) scale(1.35) rotate(0)"><circle cx="0" cy="0" r="21" fill="#20211f" stroke="#20211f"/><path d="M-9 0l6 6L10 -7" fill="none" stroke="#fafaf7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="196" y="205" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#20211f" text-anchor="middle" letter-spacing="-1">Policy accepted</text><text x="196" y="244" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#62645e" text-anchor="middle">Policy P-1048</text><path d="M27 282H365" fill="none" stroke="#b6b8af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="196" y="323" font-family="'Courier New', monospace" font-size="13" font-weight="400" fill="#20211f" text-anchor="middle" letter-spacing="1.4">ACCEPTED RESULT RETAINED</text><text x="196" y="354" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#62645e" text-anchor="middle">This policy is kept during recovery.</text></g><text x="848" y="315" font-family="'Courier New', monospace" font-size="14" font-weight="400" fill="#62645e" text-anchor="start" letter-spacing="1.4">THE APPLICATION</text><g transform="translate(848 345) scale(1) rotate(0)"><rect x="0" y="0" width="462" height="143" rx="4" fill="#fafaf7" stroke="#b6b8af" /><path d="M22 39l15-24 15 24Z" fill="none" stroke="#20211f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="37" y="34" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#20211f" text-anchor="middle">!</text><text x="68" y="42" font-family="'Courier New', monospace" font-size="13" font-weight="400" fill="#20211f" text-anchor="start" letter-spacing="1.4">LOCAL UPDATE FAILED</text><text x="24" y="85" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#20211f" text-anchor="start" letter-spacing="-0.7">Customer activation incomplete</text><text x="24" y="119" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#62645e" text-anchor="start">The policy was already accepted.</text></g><path d="M556 416H818" fill="none" stroke="#20211f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M812 412l6 4-6 4" fill="none" stroke="#20211f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="687" y="389" font-family="'Courier New', monospace" font-size="12" font-weight="400" fill="#62645e" text-anchor="middle" letter-spacing="1.4">ACCEPTED RESULT</text><path d="M1079 499L1079 555" fill="none" stroke="#20211f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M1075 549l4 6 4-6" fill="none" stroke="#20211f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><rect x="848" y="572" width="462" height="68" rx="4" fill="#20211f" stroke="#20211f" /><text x="1079" y="615" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="#fafaf7" text-anchor="middle" letter-spacing="-0.6">Retry customer activation</text><path d="M1079 652L1079 708" fill="none" stroke="#20211f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M1075 702l4 6 4-6" fill="none" stroke="#20211f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(848 727) scale(1) rotate(0)"><rect x="0" y="0" width="462" height="143" rx="4" fill="#fafaf7" stroke="#b6b8af" /><g transform="translate(37 37) scale(0.68) rotate(0)"><circle cx="0" cy="0" r="21" fill="#20211f" stroke="#20211f"/><path d="M-9 0l6 6L10 -7" fill="none" stroke="#fafaf7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="68" y="42" font-family="'Courier New', monospace" font-size="13" font-weight="400" fill="#20211f" text-anchor="start" letter-spacing="1.4">LOCAL RECORD UPDATED</text><text x="24" y="85" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#20211f" text-anchor="start" letter-spacing="-0.7">Customer record active</text><text x="24" y="119" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#62645e" text-anchor="start">Linked to the existing policy P-1048.</text></g><text x="121" y="856" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="#20211f" text-anchor="start" letter-spacing="-0.6">The accepted policy stays in place.</text><text x="121" y="892" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#62645e" text-anchor="start">Only the customer record needs recovery.</text><path d="M64 954H1336" fill="none" stroke="#999d93" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="985" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#62645e" text-anchor="start">Illustrative record. The policy submission is not repeated.</text><text x="1336" y="985" font-family="'Courier New', monospace" font-size="12" font-weight="400" fill="#62645e" text-anchor="end" letter-spacing="1.4">FAILURE &amp; RECOVERY</text>
</svg>