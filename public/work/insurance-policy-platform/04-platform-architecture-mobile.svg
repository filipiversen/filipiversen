<svg xmlns="http://www.w3.org/2000/svg" id="svg-04-platform-architecture-mobile" width="700" height="1490" viewBox="0 0 700 1490" role="img" aria-labelledby="svg-04-platform-architecture-mobile-title svg-04-platform-architecture-mobile-desc">
<title id="svg-04-platform-architecture-mobile-title">A stack with clear responsibilities</title>
<desc id="svg-04-platform-architecture-mobile-desc">Customer, broker, and admin experiences share a Next.js and TypeScript application hosted on AWS Lightsail. Server business rules and access checks connect through TypeORM to PostgreSQL, with external payment, address validation, and policy submission services.</desc>
<defs>
 <pattern id="svg-04-platform-architecture-mobile-dots" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#767b70" opacity=".35"/></pattern>
 <filter id="svg-04-platform-architecture-mobile-shadow" x="-15%" y="-15%" width="140%" height="150%"><feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#20251c" flood-opacity=".10"/></filter>
</defs>
<style>#svg-04-platform-architecture-mobile text {font-synthesis:none;font-variant-numeric:tabular-nums} #svg-04-platform-architecture-mobile {isolation:isolate}</style>
<rect x="0" y="0" width="700" height="3000" rx="0" fill="#f2f1ec" stroke="none" /><text x="42" y="42" font-family="'Courier New', monospace" font-size="12" font-weight="400" fill="#62645e" text-anchor="start" letter-spacing="1.4">INSURANCE PLATFORM / FIELD NOTES</text><text x="658" y="42" font-family="'Courier New', monospace" font-size="12" font-weight="400" fill="#62645e" text-anchor="end" letter-spacing="1.4">04</text><path d="M42 61H658" fill="none" stroke="#999d93" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="128" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="600" fill="#20211f" text-anchor="start" letter-spacing="-2.4">The stack.</text><text x="42" y="185" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="600" fill="#20211f" text-anchor="start" letter-spacing="-2.4">Every layer has a job.</text><text x="42" y="227" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#62645e" text-anchor="start">A shared application with focused integrations.</text><rect x="42" y="293" width="616" height="430" rx="5" fill="none" stroke="#93998b" stroke-dasharray="5 5"/><text x="65" y="325" font-family="'Courier New', monospace" font-size="13" font-weight="400" fill="#62645e" text-anchor="start" letter-spacing="1.4">AWS LIGHTSAIL / APP HOSTING</text><g transform="translate(66 359) scale(1) rotate(0)"><rect x="0" y="0" width="174" height="96" rx="4" fill="#fafaf7" stroke="#b6b8af" /><text x="19" y="35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#20211f" text-anchor="start" letter-spacing="-0.5">Customer</text><text x="19" y="68" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#62645e" text-anchor="start">Quote &amp; pay</text></g><path d="M153 455L153 484" fill="none" stroke="#b6b8af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(256 359) scale(1) rotate(0)"><rect x="0" y="0" width="174" height="96" rx="4" fill="#fafaf7" stroke="#b6b8af" /><text x="19" y="35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#20211f" text-anchor="start" letter-spacing="-0.5">Broker</text><text x="19" y="68" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#62645e" text-anchor="start">Own quotes</text></g><path d="M343 455L343 484" fill="none" stroke="#b6b8af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(446 359) scale(1) rotate(0)"><rect x="0" y="0" width="174" height="96" rx="4" fill="#fafaf7" stroke="#b6b8af" /><text x="19" y="35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#20211f" text-anchor="start" letter-spacing="-0.5">Admin</text><text x="19" y="68" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#62645e" text-anchor="start">Configure</text></g><path d="M533 455L533 484" fill="none" stroke="#b6b8af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M153 484H533" fill="none" stroke="#b6b8af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M343 484L343 510" fill="none" stroke="#20211f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M339 504l4 6 4-6" fill="none" stroke="#20211f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(70 511) scale(1) rotate(0)"><rect x="0" y="0" width="560" height="202" rx="4" fill="#20211f" stroke="#20211f" /><text x="25" y="34" font-family="'Courier New', monospace" font-size="12" font-weight="400" fill="#bfc3b9" text-anchor="start" letter-spacing="1.4">APPLICATION RUNTIME</text><text x="25" y="86" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500" fill="#fafaf7" text-anchor="start" letter-spacing="-1.4">Next.js + TypeScript</text><text x="25" y="123" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#d1d4cb" text-anchor="start">Interface and API in one application</text><path d="M25 149H535" fill="none" stroke="#575d50" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="25" y="181" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#e5e7de" text-anchor="start">Eligibility · Pricing · Access · Submissions</text></g><path d="M350 735L350 816" fill="none" stroke="#20211f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M346 810l4 6 4-6" fill="none" stroke="#20211f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="370" y="781" font-family="'Courier New', monospace" font-size="14" font-weight="400" fill="#62645e" text-anchor="start" letter-spacing="1.4">TYPEORM</text><g transform="translate(100 832) scale(1) rotate(0)"><rect x="0" y="0" width="500" height="91" rx="4" fill="#fafaf7" stroke="#b6b8af" /><g transform="translate(26 23)"><path d="M0 7v28c0 10 45 10 45 0V7" fill="none" stroke="#20211f" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="22.5" cy="7" rx="22.5" ry="7" fill="#f2f1ec" stroke="#20211f"/><path d="M0 21c0 10 45 10 45 0" fill="none" stroke="#20211f" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="96" y="38" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#20211f" text-anchor="start" letter-spacing="-0.8">PostgreSQL</text><text x="96" y="65" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#62645e" text-anchor="start">Quotes · partners · submissions</text></g><text x="42" y="1000" font-family="'Courier New', monospace" font-size="14" font-weight="400" fill="#62645e" text-anchor="start" letter-spacing="1.4">EXTERNAL SERVICES</text><g transform="translate(92 1025) scale(1) rotate(0)"><rect x="0" y="0" width="544" height="103" rx="4" fill="#fa